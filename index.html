<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
   #logo-size {
    width: 400px;
    height: 400px;
}

.div-card {
    
    width: 400px;
    height: 600px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 2px solid transparent;
    background-color: white;
    border-radius: 30px;
    
}

body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color:  hsl(216, 15%, 48%);
    margin: 300px;
    padding: 100px;
}

#card-paragraph, #card-title {
    text-align: center;
   
}

#card-paragraph {
     font-size: 15px;
}
  </style>
</head>
<body>

  <div class="div-card">
    <img src="image-qr-code.png" id="logo-size">
    <h2 id="card-title">Improve your Front-end skils by building a projects</h2>
    <p id="card-paragraph">Scan the QR code to visit Front-end Montor and take your coding skills to the next level</p>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">MATELO Dylane Penouel</a>.
  </footer>
</body>
</html>
